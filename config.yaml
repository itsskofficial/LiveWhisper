# LiveWhisper configuration.
# Most of this is editable from the app: tray icon > Settings.

hotkeys:
  record: ctrl+alt+space      # start / stop recording
  cycle_profile: ctrl+alt+p   # switch to the next prompt profile
  toggle_backend: ctrl+alt+g  # flip between engines
  cancel: ctrl+alt+x          # abort the current recording, transcribe nothing
  write: ctrl+alt+w           # speak an instruction: "reply saying I can't make Thursday"
  fix: ctrl+alt+f             # grammar/spelling pass over the text in this field
  notes: ctrl+alt+n           # toggle notes mode - transcripts go to a note file
  devanagari: ctrl+alt+h      # keep the NEXT dictation in Devanagari script

audio:
  capture_system: true        # WASAPI loopback - what the other participants say.
                              # Used in notes mode (Ctrl+Alt+N), for meetings.
  capture_mic: true           # your microphone - what you say
  dictation_includes_system: false  # dictation records your microphone only, so
                              # music or a video playing does not end up in the
                              # text. true = record system audio while dictating too
  system_gain: 1.0
  mic_gain: 1.0

# The one switch in the app window (AI -> Online): where the work happens.
#   local   speech, formatting and writing all on this PC; nothing leaves it
#   online  all three on Groq (needs a free key), falling back to this PC when
#           Groq cannot answer. A language whose own accuracy model is
#           downloaded is still transcribed here: it is far more accurate.
# The app sets the three settings below from it.
processing: local

transcription:
  # auto  - Groq first, fall back to local when Groq is out of credit or offline
  # groq  - Groq only
  # local - local only, nothing leaves this machine
  backend: local

  fallback_cooldown_minutes: 60   # after Groq refuses, stop retrying it for this
                                  # long instead of stalling every recording

  # The languages you dictate in. Whisper otherwise picks from all 99, and on
  # a two-second clip it will hear Malayalam as Romanian. Blank = the language
  # set under `script.language` plus English. A list such as [hi, mr, en]
  # overrides that; "all" removes the restriction entirely.
  languages:

  groq:
    model: whisper-large-v3
    api_key_env: GROQ_API_KEY # read from .env or the environment
    chunk_seconds: 600        # split long audio to stay under the upload cap
    language:                 # null = auto-detect.
                              # IMPORTANT for Hindi/English (or any code-switched)
                              # meetings: Groq's whisper-large-v3 transliterates
                              # English into Devanagari when it auto-detects Hindi
                              # ("that's your take" -> "देट्स यॉर टेक").
                              # Set "en" to get a clean English translation, or
                              # use the local engine to keep natural Hinglish.

  local:
    model: large-v3           # large-v3 is the accuracy pick for 10+ languages.
                              # large-v3-turbo is ~2x faster but weaker on
                              # non-English audio.
    device: cuda              # cuda | cpu
    compute_type: int8_float16  # ~3 GB VRAM. float16 (~5 GB) for max quality.
    paragraph_gap_seconds: 1.6  # a pause at least this long starts a new
                                # paragraph. 0 joins everything with spaces.
    language:                 # null = auto-detect. Or force e.g. "en", "hi", "mr".
    # Specialist models per language. Detection always runs on `model` above;
    # decoding switches to a specialist when the detected language has one.
    # Install them with `python -m livewhisper.specialists install <lang>`, which
    # downloads, converts and writes the entry here. Hand-written form:
    #   models:
    #     ta: D:/models/ct2/ta-medium
    #     hi: {path: D:/models/ct2/hinglish-prime, latin_output: true, language: en}
    # latin_output = the model writes romanized text itself; language = the
    # token to decode with. At most max_extra_models stay loaded at once.
    models: {}
    max_extra_models: 1
    beam_size: 5
    batch_size: 8             # decode VAD chunks in parallel. Big speedup on long
                              # meetings. Lower to 4 if you run out of VRAM; 1
                              # disables batching.
    chunk_length: 15          # seconds of speech per decoded window. The library
                              # default, 30, makes Whisper stop early: paragraphs
                              # kept 74% of Hindi words and 77% of English.
                              # 15 kept 96% and 93% at no cost to single
                              # sentences. tests/results/decode_windows.md
    vad_filter: true
    condition_on_previous_text: false  # keep false: stops language context
                                       # bleeding across segments when speakers
                                       # code-switch mid-meeting

  # Optional: bias the decoder toward names/jargon it keeps mishearing.
  # e.g. "Attendees: Priya, Marcus. Topics: database vendor, migration timeline."
  vocabulary: ""

output:
  auto_paste: true            # send Ctrl+V into whatever field has focus
  copy_to_clipboard: true     # put the text on the clipboard
  restore_clipboard: false    # false = leave the transcript on the clipboard, so a
                              # failed auto-paste is recoverable with a manual Ctrl+V
  save_transcripts: true
  transcript_dir: transcripts
  remove_fillers: true        # drop "um", "uh", "erm". Repeated words are never
                              # touched: "dheere dheere" is Hindi grammar

  # Finishing the text before it is pasted: spoken punctuation ("comma", "new
  # paragraph", "bullet point"), corrections you make out loud ("Monday, I mean
  # Tuesday"), emails and percentages written the way they are typed, and
  # sentence case. Rules, not a model: about half a millisecond per 100 words.
  format:
    enabled: true
    # Who does the formatting.
    #   auto        a very small local model - the app's own when downloaded,
    #               else Ollama's - otherwise the rules.
    #               qwen3:0.6b (522 MB) got 67% of test cases exactly right
    #               against 40% for rules, in 0.16 s on a GPU and 0.4 s on a CPU.
    #               Its output can only add punctuation, capitals and line
    #               breaks: the words are always the ones you said.
    #   rules       no model; instant
    #   openrouter  a free OpenRouter model, for machines that cannot run
    #               Ollama. Sends the dictation off this PC. Needs
    #               OPENROUTER_API_KEY; only models OpenRouter currently prices
    #               at zero are used, and usage stops short of the free daily
    #               limit (50 requests, or 1,000 after a credit purchase), so it
    #               cannot cost anything - past the limit the rules take over.
    engine: auto
    model: qwen3:0.6b         # the Ollama model, for auto/ollama
    timeout_seconds: 1.5      # past this, the rules result is pasted instead
    openrouter_model: auto    # or a specific id ending in :free
    style: auto               # auto picks from the app in front of you:
                              #   prose    everywhere else - full sentences
                              #   chat     Slack, Discord, Teams, WhatsApp:
                              #            no full stop added at the end
                              #   code     editors and terminals: no capitals,
                              #            and "dash m" becomes -m
                              #   verbatim nothing is changed at all
                              # Set one here to use it everywhere, or per app
                              # in the profile store.
    # Each pass can be turned off on its own. false disables it
    # everywhere; true leaves the choice to the style above, so a
    # chat app still gets no full stop added.
    marks: true               # spoken punctuation and line breaks
    auto_edit: true           # apply corrections said aloud
    entities: true            # sarthak at gmail dot com -> sarthak@gmail.com
    capitals: true            # sentence case, and a lone "i" -> "I"
    final_stop: true          # finish a sentence that ran out without one
    # Voice shortcuts: dictate only the cue and the saved text is pasted
    # instead, exactly as written. A cue said inside a sentence is just words.
    shortcuts: {}
    #   my address: "221B Baker Street, London NW1"
    #   sign off: "Thanks,\nSarthak"
    # In code editors, "camel case user name" types userName (also snake,
    # pascal, kebab and constant case).

ui:
  theme: dark-amber           # dark-amber | dark-indigo | system
  overlay: true               # floating recording pill: timer + live level meter
  overlay_meter: true         # level bars inside the pill
  overlay_position:           # remembered pill position, set by dragging it

# Prompt profiles. The active profile's prompt is prepended to the transcript
# before it is pasted. Ctrl+Alt+P cycles through them.
profiles:
- name: Raw
  prompt: ''

- name: Summarise
  prompt: |
    Summarise the key points and action items from this meeting transcript.
    Note who committed to what, and flag anything left unresolved.

    Transcript:

- name: Notes
  prompt: |
    Turn this meeting transcript into clean structured notes with headings
    and bullet points. Preserve technical detail and specific numbers.

    Transcript:

- name: Translate
  prompt: |
    Translate this meeting transcript into English. Preserve names and
    technical terms exactly as spoken.

    Transcript:

# Script handling for Hindi / Marathi.
#
# Whisper transcribes Hindi in Devanagari (क्या कर रहे हो) but almost nobody
# types Devanagari in chat, so by default we convert to the Latin spelling you
# actually use (kya kar rahe ho). Measured coverage: 92% dictionary + 8% model.
script:
  default: latin              # latin | native
  language: hi                # auto, or one of:
                              #   hi Hindi      bn Bengali    ur Urdu
                              #   pa Punjabi    mr Marathi    te Telugu
                              #   ta Tamil      gu Gujarati   kn Kannada
                              #   ml Malayalam  si Sinhala    sd Sindhi
                              #
                              # auto uses the language Whisper heard, which is
                              # right far more often than a setting you would
                              # remember to change. Pin it if you only ever
                              # speak one language and clips are short, since
                              # detection is weakest on short audio.
                              #
  # The app also reads the field you are typing into: if the text already there
  # is in the native script it keeps the native script, no setting required.

# Reading the screen, for "write a reply to this" and for grammar checks.
context:
  ocr_fallback: false         # screenshot+OCR when UI Automation finds nothing.
                              # Needed for some Chrome/Electron apps. Requires
                              # `pip install rapidocr_onnxruntime`.
  bias: true                  # tell the speech model about the names already on
                              # screen, so the people in the thread you are
                              # replying to get spelled right. Read locally,
                              # used for that one dictation, never stored and
                              # never sent anywhere.

# Text generation. Local by default so nothing leaves the machine.
actions:
  command_seconds: 8          # how long Ctrl+Alt+W listens for an instruction
  models:
    provider: auto            # auto = the app's own writing model, then Ollama,
                              # then a cloud key | builtin | ollama | groq |
                              # openai | anthropic
    model:                    # blank = that provider's default
  # Honest note: local models are fine for grammar and short rewrites. For
  # longer composition a frontier model is noticeably better. Switch the
  # provider above if you want that and are happy for the text to leave.

# Learning. The app watches what you change about what it pasted, and adapts.
learning:
  enabled: true
  min_samples: 3              # observations before a habit is applied
  promote_rule_at: 2          # different words before a spelling rule generalises
