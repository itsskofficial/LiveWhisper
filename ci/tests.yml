name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the parts that do not need audio hardware
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # CI has no sound card and no GPU, so the audio and ASR stack is not
          # installed here. The logic worth testing - romanization, the learning
          # rules, the profile store - is pure Python and runs anywhere.
          pip install numpy pyyaml "ruamel.yaml>=0.18" python-dotenv

      - name: Lexicons are present and well formed
        shell: bash
        run: python -m tools.check_data

      - name: Romanization and learning
        shell: bash
        run: python -m tools.check_core

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff
        run: ruff check livewhisper tools --output-format=github
