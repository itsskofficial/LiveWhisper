[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "experiments/results", "data"]

[tool.ruff.lint]
# Deliberately narrow: real errors only, not style opinions. A linter that
# argues about formatting in a pull request costs more than it finds.
select = ["E9", "F63", "F7", "F82", "F401"]
ignore = ["F401"]
