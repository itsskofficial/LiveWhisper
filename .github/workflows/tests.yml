name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app is Windows-only - screen reading, hotkeys and loopback capture
        # are Windows APIs - and several suites import those modules.
        os: [windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies (CPU only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # No GPU here, so skip the CUDA runtime wheel. No model weights are
          # downloaded: speech-model suites use stand-ins, the spelling model
          # runs on numpy, and the real-speech suites are behind --audio.
          grep -v '^nvidia-' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Test suites
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python run_tests.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff
        run: ruff check livewhisper tools --output-format=github
